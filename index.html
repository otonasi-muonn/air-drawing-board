<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空中お絵描き掲示板</title>
</head>
<body>
<header>
  <span class="title">🎨 空中お絵描き掲示板</span>
  <button id="tabDraw" class="active">かく</button>
  <button id="tabBoard">掲示板</button>
  <button id="fsBtn">全画面</button>
</header>
<main>
  <!-- ===== 描画ビュー ===== -->
  <section id="viewDraw" class="view show">
    <div id="stage">
      <canvas id="drawCanvas" width="960" height="720"></canvas>
      <canvas id="activeCanvas" width="960" height="720"></canvas>
      <div id="attract"><div>✋ 空中で描こう！<br><span>カメラの前で「つまむ」と線が引けるよ<br>画面タッチでも描けます</span></div></div>
      <video id="camPreview" playsinline muted></video>
      <div id="penDot"></div>
    </div>
    <div class="steps"><span class="now">① 描く</span><span>② 「完成！」を押す</span><span>③ QRでスマホに保存</span></div>
    <p class="hint">指やマウスで描いてね。カメラがある場合は「カメラで描く」で、つまむ（ピンチ）と線が引けるよ。</p>
    <div class="toolbar" id="palette"></div>
    <div class="toolbar">
      <span>太さ:</span>
      <button class="wbtn" data-w="0">細</button>
      <button class="wbtn sel" data-w="1">中</button>
      <button class="wbtn" data-w="2">太</button>
      <button class="abtn" id="undoBtn">↩ もどす</button>
      <button class="abtn" id="clearBtn">ぜんぶ消す</button>
      <button class="abtn" id="camBtn">📷 カメラで描く</button>
      <span id="camStatus"></span>
      <span id="camDebug" style="font-size:12px;color:#888"></span>
    </div>
    <div class="toolbar">
      <button class="abtn primary" id="postBtn">✅ 完成！掲示板に投稿する</button>
      <span id="meter"></span>
    </div>
  </section>

  <!-- ===== 掲示板ビュー ===== -->
  <section id="viewBoard" class="view">
    <div class="toolbar">
      <span id="boardCount"></span>
      <button class="abtn" id="adminBtn">運営モード</button>
      <button class="abtn" id="exportBtn">バックアップ書き出し</button>
      <button class="abtn" id="backDrawBtn">← 描きに行く</button>
    </div>
    <div id="boardGrid"></div>
    <p class="hint" id="boardEmpty">まだ作品がありません。</p>
  </section>

  <!-- ===== 投稿完了ビュー ===== -->
  <section id="viewDone" class="view center">
    <p class="big">投稿しました！（運営の確認後に掲示板へ表示されます）</p>
    <p>スマホで読み取ると、作品を画像で保存できます。</p>
    <canvas id="qrCanvas" width="320" height="320"></canvas>
    <p id="qrMsg"></p>
    <div class="toolbar" style="justify-content:center">
      <button class="abtn" id="fullBtn">作品を全画面で見る（写真で持ち帰る）</button>
      <button class="abtn primary" id="nextBtn">次の人へ（リセット）</button>
    </div>
    <img id="fullImg" style="display:none" alt="作品">
  </section>

  <!-- ===== スマホ復元ビュー ===== -->
  <section id="viewRestore" class="view center">
    <p class="big">あなたの作品</p>
    <img id="restoreImg" alt="復元した作品">
    <p>画像を長押しすると保存できます。</p>
    <p><a id="dlLink" class="abtn primary" style="text-decoration:none" download="air-drawing.png">PNGで保存する</a></p>
    <p id="restoreErr" class="err"></p>
  </section>
</main>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
